<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP88 Platform — React Developer & Admin Console</title>
  <meta name="description" content="OTP88 React Console. Manage API keys, monitor real-time delivery logs, simulate multi-channel OTPs, and control platform routes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- React 18 & Babel for Component Execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .auth-page-wrapper {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: rgba(15, 23, 42, 0.90);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 36px;
      backdrop-filter: blur(8px);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), var(--glow-emerald);
      position: relative;
      transform: translateZ(0);
    }
    .auth-tab-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      border: 1px solid var(--border-subtle);
    }
    .auth-tab {
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      background: var(--bg-card);
      color: var(--text-emerald);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .auth-input-group {
      margin-bottom: 18px;
    }
    .auth-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .auth-input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .auth-input:focus {
      border-color: var(--primary-emerald);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .otp-digit-inputs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin: 20px 0;
    }
    .otp-digit-input {
      width: 48px;
      height: 54px;
      text-align: center;
      font-family: var(--font-code);
      font-size: 22px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      color: var(--text-emerald);
      outline: none;
      transition: all 0.2s ease;
    }
    .otp-digit-input:focus {
      border-color: var(--primary-emerald);
      background: rgba(16, 185, 129, 0.1);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Pure React Root: Entire Application (Header, Console, Footer) Renders Here -->
  <div id="root"></div>

  <!-- React 18 Application Bundle -->
  <script type="text/babel" src="/js/react-app/App.jsx"></script>
</body>
</html>
